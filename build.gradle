plugins {
    id 'application'
    id 'java'
}

wrapper {
    gradleVersion = '8.10'
}

group = 'com.ankhorage.eddy'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.ankhorage.eddy.TextEditor'
}
